[workspace]
resolver = "2"
members = ["crates/sim_core", "crates/renderer", "crates/app", "crates/headless", "crates/storage"]
default-members = ["crates/app"]
exclude = ["legacy", "experiments/engine-lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
repository = "https://github.com/wheelofheaven/genesis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rand = "0.8"
wgpu = "=27.0.1"
winit = "=0.30.13"
glam = "=0.30.10"
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
egui = "=0.33.3"
egui-wgpu = "=0.33.3"
egui-winit = { version = "=0.33.3", default-features = false, features = ["x11", "wayland"] }
genesis-renderer = { path = "crates/renderer" }
genesis-sim-core = { path = "crates/sim_core" }
genesis-storage = { path = "crates/storage" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
# Retain the known macOS objc2 compatibility setting from the prototype.
debug-assertions = false

[profile.release]
lto = "thin"
